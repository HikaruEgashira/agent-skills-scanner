id: obfuscation
name: Obfuscation Detection
description: Detects obfuscation techniques used to hide malicious content
priority: P1
patterns:
  - id: zero-width-space
    pattern: "\\u200B"
    flags: ""
    severity: high
    message: "Obfuscation: zero-width space character detected"

  - id: rtl-override
    pattern: "\\u202E"
    flags: ""
    severity: critical
    message: "Obfuscation: right-to-left override character detected"

  - id: zero-width-joiner
    pattern: "\\u200D"
    flags: ""
    severity: medium
    message: "Obfuscation: zero-width joiner detected"

  - id: zero-width-non-joiner
    pattern: "\\u200C"
    flags: ""
    severity: medium
    message: "Obfuscation: zero-width non-joiner detected"

  - id: base64-long
    pattern: "(?:[A-Za-z0-9+/]{4}){20,}(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?"
    flags: ""
    severity: high
    message: "Obfuscation: long Base64 encoded string detected"

  - id: hex-encoded
    pattern: "(?:0x|\\\\x)[0-9A-Fa-f]{2}(?:(?:0x|\\\\x)[0-9A-Fa-f]{2}){10,}"
    flags: ""
    severity: high
    message: "Obfuscation: hex-encoded string detected"

  - id: unicode-escape
    pattern: "(?:\\\\u[0-9A-Fa-f]{4}){5,}"
    flags: ""
    severity: medium
    message: "Obfuscation: unicode escape sequence detected"

  - id: html-entities
    pattern: "(?:&#x?[0-9A-Fa-f]+;){5,}"
    flags: ""
    severity: medium
    message: "Obfuscation: HTML entity encoding detected"

  - id: invisible-text
    pattern: "<span\\s+style=[\"'].*(?:font-size:\\s*0|display:\\s*none|visibility:\\s*hidden)"
    flags: "i"
    severity: critical
    message: "Obfuscation: invisible text detected (CSS hiding)"

  - id: homoglyph
    pattern: "[\\u0430\\u0435\\u043E\\u0440\\u0441\\u0443\\u0445]"
    flags: ""
    severity: high
    message: "Obfuscation: Cyrillic homoglyph detected (potential spoofing)"
